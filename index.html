<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢 GO 體型與 Showcase 計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    <header class="text-center py-4 border-b border-slate-700">
      <h1 class="text-2xl font-bold text-yellow-400">寶可夢 GO 體型與 Showcase 計算器</h1>
      <p class="text-xs text-slate-400 mt-1">上傳截圖自動辨識，快速計算體型分佈與 Showcase 得分</p>
    </header>

    <!-- 圖片上傳區 -->
    <div class="border-2 border-dashed border-slate-600 rounded-xl p-6 text-center bg-slate-800/50 hover:border-yellow-400 transition">
      <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImage(this.files[0])">
      <label for="imageInput" class="cursor-pointer block">
        <div class="text-3xl mb-2">📸</div>
        <p class="text-sm font-medium text-slate-200">點擊或拖拽上傳寶可夢截圖</p>
        <p class="text-xs text-slate-400 mt-1">支援自動辨識身高 (m) 與體重 (kg)</p>
      </label>
    </div>

    <!-- 手動輸入/辨識結果 -->
    <div class="bg-slate-800 rounded-xl p-4 space-y-4">
      <h2 class="text-sm font-semibold text-slate-300 border-b border-slate-700 pb-2">數值設定</h2>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">身高 (m)</label>
          <input type="number" id="height" step="0.01" placeholder="例如 0.8" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">體重 (kg)</label>
          <input type="number" id="weight" step="0.01" placeholder="例如 24.0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-400">
        </div>
      </div>
      <button onclick="calculate()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-2 rounded transition text-sm">開始計算</button>
    </div>

    <!-- 計算結果展示區 -->
    <div id="result" class="hidden bg-slate-800 rounded-xl p-4 space-y-3">
      <h2 class="text-sm font-semibold text-slate-300 border-b border-slate-700 pb-2">分析結果</h2>
      <div id="resultContent" class="text-sm space-y-1"></div>
    </div>
  </div>

  <script>
    async function handleImage(file) {
      if (!file) return;
      alert("正在自動辨識圖片中，請稍候...");
      try {
        const worker = await Tesseract.createWorker('chi_tra+eng');
        const ret = await worker.recognize(file);
        const text = ret.data.text;
        await worker.terminate();

        const heightMatch = text.match(/(\d+(\.\d+)?)\s*m/i);
        const weightMatch = text.match(/(\d+(\.\d+)?)\s*kg/i);

        if (heightMatch) document.getElementById('height').value = heightMatch[1];
        if (weightMatch) document.getElementById('weight').value = weightMatch[1];

        alert("辨識完成！請確認數值後點擊計算。");
      } catch (e) {
        alert("圖片辨識失敗，請改用手動輸入數值。");
      }
    }

    function calculate() {
      const h = parseFloat(document.getElementById('height').value);
      const w = parseFloat(document.getElementById('weight').value);
      const res = document.getElementById('result');
      const resContent = document.getElementById('resultContent');

      if (!h || !w) {
        alert("請輸入有效的身高與體重！");
        return;
      }

      let category = "一般 (Normal)";
      if (h >= 1.2) category = "XXL (巨型)";
      else if (h >= 1.0) category = "XL (大型)";
      else if (h <= 0.39) category = "XXS (微型)";
      else if (h <= 0.59) category = "XS (小型)";

      resContent.innerHTML = `
        <p>📏 體型類別：<strong class="text-yellow-400">${category}</strong></p>
        <p>⚖️ 輸入身高：${h} m | 輸入體重：${w} kg</p>
      `;
      res.classList.remove('hidden');
    }
  </script>
</body>
</html>
