<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 截圖辨識計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6 font-sans">

  <div class="max-w-xl mx-auto space-y-5">
    
    <!-- 標題 -->
    <header class="text-center py-3 border-b border-slate-800">
      <h1 class="text-xl md:text-2xl font-bold text-amber-400 tracking-wide">AI 視覺辨識計算器</h1>
      <p class="text-xs text-slate-400 mt-1">串接 Gemini API：100% 精準判斷名字、體型與 IV (0-15)</p>
    </header>

    <!-- API Key 設定區 -->
    <div class="bg-slate-800/90 border border-amber-500/30 rounded-2xl p-4 space-y-2">
      <label class="block text-xs font-bold text-amber-300">🔑 請輸入你的 Gemini API Key：</label>
      <div class="flex gap-2">
        <input type="password" id="apiKeyInput" placeholder="貼上 AI Studio 申請的 API Key (AIzaSy...)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-400 font-mono">
        <button onclick="saveApiKey()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition">儲存 Key</button>
      </div>
      <p class="text-[11px] text-slate-400">💡 Key 只會儲存在你的瀏覽器本機 (localStorage)，不會上傳至任何伺服器。</p>
    </div>

    <!-- 圖片上傳區 -->
    <div class="bg-slate-800/80 border-2 border-dashed border-amber-500/40 rounded-2xl p-5 text-center hover:border-amber-400 transition-all shadow-lg">
      <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="processImageWithGemini(this.files[0])">
      <label for="imageInput" class="cursor-pointer block space-y-2">
        <div class="text-3xl">📸</div>
        <div class="text-sm font-semibold text-amber-300">點擊上傳寶可夢評價截圖</div>
        <div class="text-xs text-slate-400">AI 將依序自動填入：1.名稱 ➔ 2.體重 ➔ 3.身高 ➔ 4.攻擊 ➔ 5.防禦 ➔ 6.HP</div>
      </label>
      <div id="statusText" class="text-xs text-amber-400 mt-3 font-medium min-h-[1.25rem]"></div>
    </div>

    <!-- 表單填寫區 -->
    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-700 pb-2">
        📋 數據填寫順序 (1 ~ 6)
      </div>

      <!-- 1. 名稱 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">1. 寶可夢名稱</label>
        <input type="text" id="pokeName" placeholder="例如：膽小蟲、拉普拉斯" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-amber-300 focus:outline-none focus:border-amber-400">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- 2. 體重 -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">2. 體重 (kg)</label>
          <input type="number" id="weight" step="0.01" placeholder="例如：16.3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-mono focus:outline-none focus:border-amber-400">
        </div>
        <!-- 3. 身高 -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">3. 身高 (m)</label>
          <input type="number" id="height" step="0.01" placeholder="例如：0.62" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-mono focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- IV 個體值 -->
      <div class="pt-2 border-t border-slate-700/60">
        <label class="block text-xs font-medium text-slate-300 mb-2">IV 個體值 (0 ~ 15)</label>
        <div class="grid grid-cols-3 gap-2.5">
          <!-- 4. 攻擊 -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-rose-400 block mb-1">4. 攻擊</span>
            <input type="number" id="ivAtk" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-rose-400">
          </div>
          <!-- 5. 防禦 -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-sky-400 block mb-1">5. 防禦</span>
            <input type="number" id="ivDef" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-sky-400">
          </div>
          <!-- 6. HP -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-emerald-400 block mb-1">6. HP</span>
            <input type="number" id="ivHp" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-emerald-400">
          </div>
        </div>
      </div>

      <button onclick="calculate()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-md text-sm">
        🚀 計算結果與報告
      </button>
    </div>

    <!-- 結果展現區 -->
    <div id="resultCard" class="hidden bg-slate-800 border border-amber-500/30 rounded-2xl p-5 space-y-3 shadow-xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <span class="text-xs font-bold text-amber-400">📊 辨識報告</span>
        <span id="ivBadge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500 text-slate-950"></span>
      </div>
      <div id="resultBody" class="space-y-2 text-sm"></div>
    </div>

  </div>

  <script>
    // 網頁載入時自動讀取已儲存的 API Key
    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) {
        alert("請輸入有效的 API Key！");
        return;
      }
      localStorage.setItem('gemini_api_key', key);
      alert("✅ API Key 已成功儲存在本機！");
    }

    async function processImageWithGemini(file) {
      if (!file) return;

      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
      if (!apiKey) {
        alert("請先輸入並儲存 Gemini API Key！");
        return;
      }

      const status = document.getElementById('statusText');
      status.innerText = "🤖 正在傳送至 Gemini AI 視覺模型進行分析...";

      // 將圖片轉為 Base64 格式
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];

        const prompt = `你是一個專業的 Pokémon GO 截圖資料分析師。
請仔細分析這張寶可夢評價截圖，嚴格辨識以下數據：
1. 寶可夢中文名稱 (例如：拉普拉斯、膽小蟲、稚山雀、臭泥)
2. 體重 (kg，數字)
3. 身高 (m，數字)
4. 攻擊 IV (0-15 的整數，每條被兩條白線分成三格，第一格滿為5，第二格滿為10，全滿為15。請仔細看橘黃色條長度，例如膽小蟲沒完全碰到第二條白線是9)
5. 防禦 IV (0-15 的整數)
6. HP IV (0-15 的整數)

請嚴格只回傳 JSON 格式，絕對不要有任何其他文字、Markdown 標籤或說明：
{
  "name": "寶可夢名稱",
  "weight": 0.0,
  "height": 0.0,
  "atk": 0,
  "def": 0,
  "hp": 0
}`;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: file.type, data: base64Data } }
                ]
              }]
            })
          });

          const data = await response.json();
          const rawText = data.candidates[0].content.parts[0].text;
          
          // 清理 JSON 字串
          const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleanJson);

          // 依序填入表單 (1.名稱 ➔ 2.體重 ➔ 3.身高 ➔ 4.攻擊 ➔ 5.防禦 ➔ 6.HP)
          document.getElementById('pokeName').value = parsed.name || "";
          document.getElementById('weight').value = parsed.weight || "";
          document.getElementById('height').value = parsed.height || "";
          document.getElementById('ivAtk').value = parsed.atk ?? "";
          document.getElementById('ivDef').value = parsed.def ?? "";
          document.getElementById('ivHp').value = parsed.hp ?? "";

          status.innerText = "✅ AI 辨識成功！請核對資料後點擊計算。";
        } catch (err) {
          console.error(err);
          status.innerText = "❌ 辨識失敗，請檢查 API Key 是否正確或圖片品質。";
        }
      };
    }

    function calculate() {
      const name = document.getElementById('pokeName').value || "未命名";
      const w = parseFloat(document.getElementById('weight').value) || 0;
      const h = parseFloat(document.getElementById('height').value) || 0;
      const atk = parseInt(document.getElementById('ivAtk').value) || 0;
      const def = parseInt(document.getElementById('ivDef').value) || 0;
      const hp = parseInt(document.getElementById('ivHp').value) || 0;

      const totalIv = atk + def + hp;
      const ivPercent = ((totalIv / 45) * 100).toFixed(1);

      document.getElementById('ivBadge').innerText = `IV: ${ivPercent}% (${totalIv}/45)`;
      document.getElementById('resultBody').innerHTML = `
        <div class="text-base font-bold text-white mb-1">1. 名稱：<span class="text-amber-300">${name}</span></div>
        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 font-mono">
          <div>2. 體重：<span class="font-bold text-white">${w} kg</span></div>
          <div>3. 身高：<span class="font-bold text-white">${h} m</span></div>
          <div>4. 攻擊：<span class="font-bold text-rose-400">${atk}</span> / 15</div>
          <div>5. 防禦：<span class="font-bold text-sky-400">${def}</span> / 15</div>
          <div class="col-span-2">6. HP：<span class="font-bold text-emerald-400">${hp}</span> / 15</div>
        </div>
      `;
      document.getElementById('resultCard').classList.remove('hidden');
    }
  </script>
</body>
</html>
