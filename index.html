<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢 GO Showcase 與體型計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    <header class="text-center py-4 border-b border-slate-700">
      <h1 class="text-2xl font-bold text-yellow-400">寶可夢 GO 截圖辨識 & Showcase 計算器</h1>
      <p class="text-xs text-slate-400 mt-1">上傳評價截圖自動辨識：名稱、身高、體重與 IV（15/15/15）</p>
    </header>

    <!-- 圖片上傳區 -->
    <div class="border-2 border-dashed border-slate-600 rounded-xl p-6 text-center bg-slate-800/50 hover:border-yellow-400 transition">
      <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(this.files[0])">
      <label for="imageInput" class="cursor-pointer block">
        <div class="text-4xl mb-2">📸</div>
        <p class="text-sm font-medium text-slate-200">點擊或拖拽上傳隊長評價截圖</p>
        <p class="text-xs text-slate-400 mt-1">自動分析身高、體重與左下角 3 格 IV 能量柱</p>
      </label>
    </div>

    <!-- 辨識與輸入結果表單 -->
    <div class="bg-slate-800 rounded-xl p-5 space-y-4 border border-slate-700">
      <h2 class="text-sm font-semibold text-slate-300 border-b border-slate-700 pb-2 flex items-center justify-between">
        <span>📋 寶可夢數據</span>
        <span id="statusText" class="text-xs font-normal text-slate-400"></span>
      </h2>

      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="block text-xs text-slate-400 mb-1">寶可夢名稱</label>
          <input type="text" id="pokeName" placeholder="例如：拉普拉斯" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">體重 (kg)</label>
          <input type="number" id="weight" step="0.01" placeholder="例如：241.29" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">身高 (m)</label>
          <input type="number" id="height" step="0.01" placeholder="例如：2.82" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-400">
        </div>
      </div>

      <!-- IV 三格柱狀圖數值 -->
      <div class="pt-2 border-t border-slate-700">
        <label class="block text-xs text-slate-400 mb-2">IV 個體值 (每條分成 3 格，單條最高 15)</label>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <span class="text-xs text-red-400 block mb-1">攻擊 (0-15)</span>
            <input type="number" id="ivAtk" min="0" max="15" placeholder="0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white text-center focus:outline-none focus:border-yellow-400">
          </div>
          <div>
            <span class="text-xs text-blue-400 block mb-1">防禦 (0-15)</span>
            <input type="number" id="ivDef" min="0" max="15" placeholder="0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white text-center focus:outline-none focus:border-yellow-400">
          </div>
          <div>
            <span class="text-xs text-green-400 block mb-1">HP (0-15)</span>
            <input type="number" id="ivHp" min="0" max="15" placeholder="0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white text-center focus:outline-none focus:border-yellow-400">
          </div>
        </div>
      </div>

      <button onclick="calculateScore()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-2.5 rounded-lg transition text-sm shadow-md">
        🧮 計算 Showcase 點數 & 體型
      </button>
    </div>

    <!-- 計算結果展示 -->
    <div id="resultBox" class="hidden bg-slate-800 rounded-xl p-5 border border-yellow-500/30 space-y-3">
      <h2 class="text-sm font-semibold text-yellow-400 border-b border-slate-700 pb-2">📊 分析與得分結果</h2>
      <div id="resultContent" class="text-sm space-y-2"></div>
    </div>
  </div>

  <canvas id="cropCanvas" class="hidden"></canvas>

  <script>
    // 處理圖片上傳與 OCR/IV 圖像分析
    async function handleImageUpload(file) {
      if (!file) return;
      
      const statusText = document.getElementById('statusText');
      statusText.innerText = "⏳ 正在辨識截圖與分析 IV 能量柱...";

      const img = new Image();
      img.src = URL.createObjectURL(file);
      
      img.onload = async () => {
        // 1. 利用 Canvas 進行 IV 能量柱（3格白線分段）光譜分析
        analyzeIVFromImage(img);

        // 2. 使用 Tesseract OCR 讀取文字 (名稱、身高、體重)
        try {
          const worker = await Tesseract.createWorker('chi_tra+eng');
          const ret = await worker.recognize(file);
          const text = ret.data.text;
          await worker.terminate();

          // 抓取體重
          const weightMatch = text.match(/(\d+(\.\d+)?)\s*kg/i);
          if (weightMatch) document.getElementById('weight').value = weightMatch[1];

          // 抓取身高
          const heightMatch = text.match(/(\d+(\.\d+)?)\s*m/i);
          if (heightMatch) document.getElementById('height').value = heightMatch[1];

          // 抓取常見寶可夢名稱 (例如拉普拉斯)
          if (text.includes("拉普拉斯")) document.getElementById('pokeName').value = "拉普拉斯";

          statusText.innerText = "✅ 辨識完成！";
        } catch (e) {
          statusText.innerText = "⚠️ 文字辨識完成，IV 區域已自動計算。";
        }
      };
    }

    // 精確分析左下角三條 IV 能量柱 (每條 15 點，白線分成 3 格每格 5 點)
    function analyzeIVFromImage(img) {
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      // 左下角 IV 卡片區域的相對位置座標估算 (針對標準直式截圖)
      const ivAreaX = Math.floor(img.width * 0.11);
      const ivAreaWidth = Math.floor(img.width * 0.36);
      
      // 攻擊、防禦、HP 的相對 Y 軸高
      const yAtk = Math.floor(img.height * 0.755);
      const yDef = Math.floor(img.height * 0.805);
      const yHp  = Math.floor(img.height * 0.855);

      document.getElementById('ivAtk').value = getIvFromBar(ctx, ivAreaX, yAtk, ivAreaWidth);
      document.getElementById('ivDef').value = getIvFromBar(ctx, ivAreaX, yDef, ivAreaWidth);
      document.getElementById('ivHp').value  = getIvFromBar(ctx, ivAreaX, yHp,  ivAreaWidth);
    }

    // 計算單一屬性條的填滿比例與 IV 點數 (0 - 15)
    function getIvFromBar(ctx, startX, startY, width) {
      const imgData = ctx.getImageData(startX, startY, width, 12).data;
      let maxFilledPixel = 0;

      for (let x = 0; x < width; x++) {
        let isFilledColor = false;
        for (let y = 0; y < 12; y++) {
          const index = (y * width + x) * 4;
          const r = imgData[index];
          const g = imgData[index + 1];
          const b = imgData[index + 2];

          // 檢測橘黃色/紅色/粉色填滿條的光譜 (白線與背景灰不同)
          if ((r > 200 && g > 100 && b < 120) || (r > 220 && g < 100 && b < 100)) {
            isFilledColor = true;
            break;
          }
        }
        if (isFilledColor) {
          maxFilledPixel = x;
        }
      }

      const ratio = maxFilledPixel / width;
      // 將比例換算為 0 - 15 點 (每 1/3 區塊代表 5 點)
      let rawIv = Math.round(ratio * 15);
      return Math.min(15, Math.max(0, rawIv));
    }

    // Showcase 與體型計算函數
    function calculateScore() {
      const name = document.getElementById('pokeName').value || "寶可夢";
      const w = parseFloat(document.getElementById('weight').value) || 0;
      const h = parseFloat(document.getElementById('height').value) || 0;
      const atk = parseInt(document.getElementById('ivAtk').value) || 0;
      const def = parseInt(document.getElementById('ivDef').value) || 0;
      const hp = parseInt(document.getElementById('ivHp').value) || 0;

      if (!w || !h) {
        alert("請輸入有效的身高與體重數值！");
        return;
      }

      // 體型判定
      let category = "一般 (Normal)";
      if (h >= 1.2 * 0.8 * 1.5 || h >= 2.8) category = "XXL (巨型)";
      else if (h <= 0.4) category = "XXS (微型)";

      // IV 總分數計算 (總共 45 分，佔比加分)
      const ivTotal = atk + def + hp;
      const ivScore = Math.round((ivTotal / 45) * 50);

      const resultBox = document.getElementById('resultBox');
      const resultContent = document.getElementById('resultContent');

      resultContent.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <span class="font-bold text-base text-white">${name}</span>
          <span class="px-2 py-0.5 rounded text-xs font-bold ${category.includes('XXL') ? 'bg-amber-500 text-slate-900' : 'bg-slate-700 text-slate-300'}">${category}</span>
        </div>
        <p>📏 <strong>身高：</strong>${h} m</p>
        <p>⚖️ <strong>體重：</strong>${w} kg</p>
        <p>⚔️ <strong>IV 數值：</strong>${atk} / ${def} / ${hp} (共 ${ivTotal}/45)</p>
        <p>🌟 <strong>Showcase IV 加分估算：</strong><span class="text-yellow-400 font-bold">${ivScore}</span> / 50 pt</p>
      `;

      resultBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
