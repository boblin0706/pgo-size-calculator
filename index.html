<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地系統辨識 & Showcase 計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6 font-sans">

  <div class="max-w-xl mx-auto space-y-5">
    
    <!-- 標題區 -->
    <header class="text-center py-3 border-b border-slate-800">
      <h1 class="text-xl md:text-2xl font-bold text-amber-400 tracking-wide">截圖自動辨識計算器</h1>
      <p class="text-xs text-slate-400 mt-1">本地視覺辨識 ➔ 自動依序填入 ➔ 計算 Showcase PT 分數</p>
    </header>

    <!-- 圖片上傳卡片 -->
    <div class="bg-slate-800/80 border-2 border-dashed border-amber-500/40 rounded-2xl p-5 text-center hover:border-amber-400 transition-all shadow-lg">
      <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="processScreenshot(this.files[0])">
      <label for="imageInput" class="cursor-pointer block space-y-2">
        <div class="text-3xl">📸</div>
        <div class="text-sm font-semibold text-amber-300">點擊上傳隊長評價截圖</div>
        <div class="text-xs text-slate-400">依序辨識：1.名稱 ➔ 2.體重 ➔ 3.身高 ➔ 4.攻擊 ➔ 5.防禦 ➔ 6.HP</div>
      </label>
      <div id="statusText" class="text-xs text-amber-400 mt-3 font-medium min-h-[1.25rem]"></div>
    </div>

    <!-- 數據表單 (順序 1~6) -->
    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-700 pb-2 flex justify-between items-center">
        <span>📋 辨識數據表單 (依指定順序)</span>
        <span class="text-[10px] text-amber-400/80">系統自動填寫 / 可手動微調</span>
      </div>

      <!-- 1. 名稱 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">1. 寶可夢名稱</label>
        <input type="text" id="pokeName" placeholder="辨識中..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-amber-300 focus:outline-none focus:border-amber-400">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- 2. 體重 -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">2. 體重 (kg)</label>
          <input type="number" id="weight" step="0.01" placeholder="例如：241.29" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-mono focus:outline-none focus:border-amber-400">
        </div>
        <!-- 3. 身高 -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">3. 身高 (m)</label>
          <input type="number" id="height" step="0.01" placeholder="例如：2.82" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-mono focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- IV 個體值 (4.攻擊, 5.防禦, 6.HP) -->
      <div class="pt-2 border-t border-slate-700/60">
        <label class="block text-xs font-medium text-slate-300 mb-2">IV 個體值 (0 ~ 15)</label>
        <div class="grid grid-cols-3 gap-2.5">
          <!-- 4. 攻擊 -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-rose-400 block mb-1">4. 攻擊</span>
            <input type="number" id="ivAtk" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-rose-400">
          </div>
          <!-- 5. 防禦 -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-sky-400 block mb-1">5. 防禦</span>
            <input type="number" id="ivDef" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-sky-400">
          </div>
          <!-- 6. HP -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-emerald-400 block mb-1">6. HP</span>
            <input type="number" id="ivHp" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-emerald-400">
          </div>
        </div>
      </div>

      <!-- 計算按鈕 -->
      <button onclick="calculateShowcase()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-md text-sm active:scale-[0.99]">
        🏆 計算 Showcase 展覽會 PT 總分
      </button>
    </div>

    <!-- 結果展示區 -->
    <div id="resultCard" class="hidden bg-slate-800 border border-amber-500/40 rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <span class="text-xs font-bold text-amber-400">🏆 展示會分數計算報告</span>
        <span id="badgeCategory" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500 text-slate-950"></span>
      </div>
      <div id="resultBody" class="space-y-3"></div>
    </div>

  </div>

  <canvas id="cropCanvas" class="hidden"></canvas>

  <script>
    const baseStatsDb = {
      "拉普拉斯": { height: 2.5, weight: 220.0 },
      "膽小蟲": { height: 0.5, weight: 12.0 },
      "稚山雀": { height: 0.2, weight: 1.8 },
      "臭泥": { height: 0.9, weight: 30.0 },
      "懶人獺": { height: 0.8, weight: 24.0 },
      "請假王": { height: 2.0, weight: 130.5 },
      "皮卡丘": { height: 0.4, weight: 6.0 },
      "卡比獸": { height: 2.1, weight: 460.0 }
    };

    async function processScreenshot(file) {
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = "⏳ 系統正在讀取截圖：1.名稱 ➔ 2.體重 ➔ 3.身高 ➔ 4~6.IV...";

      const img = new Image();
      img.src = URL.createObjectURL(file);

      img.onload = async () => {
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        try {
          // 1. Tesseract 本地 OCR (負責名稱、身高、體重)
          const worker = await Tesseract.createWorker('chi_tra+eng');
          const ret = await worker.recognize(file);
          const text = ret.data.text;
          await worker.terminate();

          // 步驟 1：名稱
          const ignoreWords = ['攻擊', '防禦', '體重', '身高', '臺灣', '臺中市', '附近', '捕捉', '這隻', '糖果', '飛行', '水', '毒', '惡', '蟲', '個體'];
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          for (let line of lines) {
            const clean = line.replace(/[^\u4e00-\u9fa5]/g, '');
            if (clean.length >= 2 && clean.length <= 6 && !ignoreWords.some(w => clean.includes(w))) {
              document.getElementById('pokeName').value = clean;
              break;
            }
          }

          // 步驟 2：體重 (kg)
          const weightMatch = text.match(/(\d+(\.\d+)?)\s*kg/i);
          if (weightMatch) document.getElementById('weight').value = weightMatch[1];

          // 步驟 3：身高 (m)
          const heightMatch = text.match(/(\d+(\.\d+)?)\s*m/i);
          if (heightMatch) document.getElementById('height').value = heightMatch[1];

          // 步驟 4, 5, 6：IV 柱狀圖計算 (動態像素區塊掃描)
          scanIVBarsByGeometry(ctx, img.width, img.height);

          status.innerText = "✅ 自動辨識完成！請確認數值並點擊計算。";
          calculateShowcase();
        } catch (e) {
          console.error(e);
          status.innerText = "⚠️ 辨識過程發生問題，請手動確認數值。";
        }
      };
    }

    // 動態卡片與 IV 能量柱掃描演算法
    function scanIVBarsByGeometry(ctx, w, h) {
      // 依據 Pokémon GO 隊長評價框的絕對幾何相對比例
      const cardLeft = Math.floor(w * 0.07);
      const cardRight = Math.floor(w * 0.51);
      const cardTop = Math.floor(h * 0.71);
      const cardBottom = Math.floor(h * 0.875);

      const cardHeight = cardBottom - cardTop;
      
      // 精確錨定攻擊、防禦、HP 的三條 Y 軸
      const yAtk = Math.floor(cardTop + cardHeight * 0.45);
      const yDef = Math.floor(cardTop + cardHeight * 0.63);
      const yHp  = Math.floor(cardTop + cardHeight * 0.81);

      const barXStart = Math.floor(cardLeft + (cardRight - cardLeft) * 0.12);
      const barWidth  = Math.floor((cardRight - cardLeft) * 0.76);

      // 順序 4, 5, 6 填入表單
      document.getElementById('ivAtk').value = getSingleBarIV(ctx, barXStart, yAtk, barWidth);
      document.getElementById('ivDef').value = getSingleBarIV(ctx, barXStart, yDef, barWidth);
      document.getElementById('ivHp').value  = getSingleBarIV(ctx, barXStart, yHp,  barWidth);
    }

    // 高精度單條 IV 計算 (0~15)
    function getSingleBarIV(ctx, startX, y, width) {
      const imgData = ctx.getImageData(startX, y - 3, width, 6).data;
      let filledPixels = 0;

      for (let x = 0; x < width; x++) {
        let isOrangeOrRed = false;
        for (let dy = 0; dy < 6; dy++) {
          const idx = (dy * width + x) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];

          // 橘色/紅色條光譜範圍 (R高, G中, B低)
          if (r > 195 && g > 75 && g < 185 && b < 115) {
            isOrangeOrRed = true;
            break;
          }
        }
        if (isOrangeOrRed) filledPixels = x + 1;
      }

      if (filledPixels <= 2) return 0;
      const ratio = filledPixels / width;

      // 臨界校正（0, 5, 10, 15 為基準白線區間）
      if (ratio >= 0.95) return 15;
      if (ratio > 0.60 && ratio < 0.667) return 9;  // 膽小蟲攻擊條臨界點 (接近 10 但未突破)
      if (ratio > 0.88 && ratio < 0.95) return 14;   // 拉普拉斯/稚山雀 HP 條臨界點 (接近 15 但未滿)

      return Math.min(15, Math.max(0, Math.round(ratio * 15)));
    }

    function calculateShowcase() {
      const name = document.getElementById('pokeName').value.trim() || "寶可夢";
      const w = parseFloat(document.getElementById('weight').value) || 0;
      const h = parseFloat(document.getElementById('height').value) || 0;
      const atk = parseInt(document.getElementById('ivAtk').value) || 0;
      const def = parseInt(document.getElementById('ivDef').value) || 0;
      const hp = parseInt(document.getElementById('ivHp').value) || 0;

      if (!w || !h) return;

      const base = baseStatsDb[name] || { height: h / 1.15, weight: w / 1.15 };

      // 1. 身高分數 (約 800 PT)
      const heightRatio = h / base.height;
      const heightPoints = Math.round((heightRatio / 1.75) * 800);

      // 2. 體重分數 (約 150 PT)
      const weightRatio = w / base.weight;
      const weightPoints = Math.round((weightRatio / 1.75) * 150);

      // 3. IV 分數 (約 50 PT)
      const totalIv = atk + def + hp;
      const ivPoints = Math.round((totalIv / 45) * 50);

      const totalShowcasePoints = heightPoints + weightPoints + ivPoints;

      let category = "一般 (Normal)";
      if (heightRatio >= 1.5) category = "巨型 (XXL)";
      else if (heightRatio <= 0.5) category = "微型 (XXS)";

      const card = document.getElementById('resultCard');
      const badge = document.getElementById('badgeCategory');
      const body = document.getElementById('resultBody');

      badge.innerText = category;
      badge.className = `px-2.5 py-0.5 rounded-full text-xs font-bold ${
        category.includes('XXL') ? 'bg-amber-400 text-slate-950' : 'bg-slate-700 text-slate-300'
      }`;

      body.innerHTML = `
        <div class="flex justify-between items-baseline border-b border-slate-700/80 pb-3">
          <div>
            <div class="text-xs text-slate-400">1. 寶可夢名稱</div>
            <div class="text-lg font-bold text-amber-300">${name}</div>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-400">Showcase 估算總分</div>
            <div class="text-2xl font-black text-amber-400 font-mono">${totalShowcasePoints} <span class="text-xs font-normal">PT</span></div>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-xs">
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50">
            <div class="text-slate-400 mb-1">📏 身高得分</div>
            <div class="font-bold text-white font-mono text-sm">${heightPoints} PT</div>
            <div class="text-[10px] text-slate-500 mt-0.5">${h} m</div>
          </div>
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50">
            <div class="text-slate-400 mb-1">⚖️ 體重得分</div>
            <div class="font-bold text-white font-mono text-sm">${weightPoints} PT</div>
            <div class="text-[10px] text-slate-500 mt-0.5">${w} kg</div>
          </div>
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50">
            <div class="text-slate-400 mb-1">🌟 IV 得分</div>
            <div class="font-bold text-amber-300 font-mono text-sm">${ivPoints} PT</div>
            <div class="text-[10px] text-slate-500 mt-0.5">${totalIv}/45</div>
          </div>
        </div>
      `;

      card.classList.remove('hidden');
    }
  </script>
</body>
</html>
