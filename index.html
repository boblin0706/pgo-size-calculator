<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢 GO 高精度截圖辨識計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6 font-sans">

  <div class="max-w-xl mx-auto space-y-5">
    
    <!-- 頁頭 -->
    <header class="text-center py-3 border-b border-slate-800">
      <h1 class="text-xl md:text-2xl font-bold text-amber-400 tracking-wide">Pokémon GO 高精度截圖辨識計算器</h1>
      <p class="text-xs text-slate-400 mt-1">順序：1.名稱 ➔ 2.體重 ➔ 3.身高 ➔ 4.攻擊 ➔ 5.防禦 ➔ 6.HP</p>
    </header>

    <!-- 圖片上傳卡片 -->
    <div class="bg-slate-800/80 border-2 border-dashed border-amber-500/40 rounded-2xl p-5 text-center hover:border-amber-400 transition-all shadow-lg">
      <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="processScreenshot(this.files[0])">
      <label for="imageInput" class="cursor-pointer block space-y-2">
        <div class="text-3xl">📸</div>
        <div class="text-sm font-semibold text-amber-300">點擊上傳隊長評價截圖</div>
        <div class="text-xs text-slate-400">已啟用「刻度線錨點演算法」，精準辨識臨界數值</div>
      </label>
      <div id="statusText" class="text-xs text-amber-400 mt-3 font-medium min-h-[1.25rem]"></div>
    </div>

    <!-- 表單填寫區 (依 1~6 順序) -->
    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-700 pb-2 flex justify-between items-center">
        <span>📋 依序辨識資料</span>
        <span class="text-[10px] text-amber-400/80">自動 + 手動微調</span>
      </div>

      <!-- 1. 名稱 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">1. 寶可夢名稱</label>
        <input type="text" id="pokeName" placeholder="辨識中/或手動輸入..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-amber-300 focus:outline-none focus:border-amber-400 transition">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- 2. 體重 -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">2. 體重 (kg)</label>
          <input type="number" id="weight" step="0.01" placeholder="例如：241.29" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-mono focus:outline-none focus:border-amber-400">
        </div>
        <!-- 3. 身高 -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">3. 身高 (m)</label>
          <input type="number" id="height" step="0.01" placeholder="例如：2.82" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-mono focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- IV 個體值 (4, 5, 6) -->
      <div class="pt-2 border-t border-slate-700/60">
        <label class="block text-xs font-medium text-slate-300 mb-2">IV 個體值 (0 ~ 15，三段式刻度比對)</label>
        <div class="grid grid-cols-3 gap-2.5">
          <!-- 4. 攻擊 -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-rose-400 block mb-1">4. 攻擊</span>
            <input type="number" id="ivAtk" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-rose-400">
          </div>
          <!-- 5. 防禦 -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-sky-400 block mb-1">5. 防禦</span>
            <input type="number" id="ivDef" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-sky-400">
          </div>
          <!-- 6. HP -->
          <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-700/50 text-center">
            <span class="text-[11px] font-semibold text-emerald-400 block mb-1">6. HP</span>
            <input type="number" id="ivHp" min="0" max="15" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-center font-bold text-amber-300 font-mono text-sm focus:outline-none focus:border-emerald-400">
          </div>
        </div>
      </div>

      <!-- 計算按鈕 -->
      <button onclick="calculate()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-md active:scale-[0.99] text-sm">
        🚀 計算結果與 Showcase 點數
      </button>
    </div>

    <!-- 結果區 -->
    <div id="resultCard" class="hidden bg-slate-800 border border-amber-500/30 rounded-2xl p-5 space-y-3 shadow-xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <span class="text-xs font-bold text-amber-400">📊 辨識與試算報告</span>
        <span id="ivPercentBadge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500 text-slate-950"></span>
      </div>
      <div id="resultBody" class="space-y-2 text-sm"></div>
    </div>

  </div>

  <canvas id="cropCanvas" class="hidden"></canvas>

  <script>
    async function processScreenshot(file) {
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = "⏳ 正在辨識：1.名稱 ➔ 2.體重 ➔ 3.身高 ➔ 4~6.IV 刻度...";

      const img = new Image();
      img.src = URL.createObjectURL(file);

      img.onload = async () => {
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        try {
          const worker = await Tesseract.createWorker('chi_tra+eng');
          const ret = await worker.recognize(file);
          const text = ret.data.text;
          const words = ret.data.words;
          await worker.terminate();

          // 步驟 1：名稱 (過濾系統與選單詞彙)
          const ignoreWords = ['攻擊', '防禦', '體重', '身高', '臺灣', '臺中市', '附近', '捕捉', '這隻', '糖果', '飛行', '水', '毒', '惡', '蟲'];
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          
          let detectedName = "";
          for (let line of lines) {
            const clean = line.replace(/[^\u4e00-\u9fa5]/g, '');
            if (clean.length >= 2 && clean.length <= 6 && !ignoreWords.some(w => clean.includes(w))) {
              detectedName = clean;
              break;
            }
          }
          if (detectedName) document.getElementById('pokeName').value = detectedName;

          // 步驟 2：體重 (kg)
          const weightMatch = text.match(/(\d+(\.\d+)?)\s*kg/i);
          if (weightMatch) document.getElementById('weight').value = weightMatch[1];

          // 步驟 3：身高 (m)
          const heightMatch = text.match(/(\d+(\.\d+)?)\s*m/i);
          if (heightMatch) document.getElementById('height').value = heightMatch[1];

          // 步驟 4, 5, 6：攻擊, 防禦, HP (定位與高精度刻度校正)
          let atkY = null, defY = null, hpY = null;
          words.forEach(w => {
            if (w.text.includes('攻擊')) atkY = w.bbox.y0 + (w.bbox.y1 - w.bbox.y0) / 2;
            if (w.text.includes('防禦')) defY = w.bbox.y0 + (w.bbox.y1 - w.bbox.y0) / 2;
            if (w.text.includes('HP')) hpY = w.bbox.y0 + (w.bbox.y1 - w.bbox.y0) / 2;
          });

          // 相容性標準位移
          if (!atkY) atkY = img.height * 0.748;
          if (!defY) defY = img.height * 0.803;
          if (!hpY)  hpY  = img.height * 0.858;

          const barXStart = Math.floor(img.width * 0.22);
          const barWidth = Math.floor(img.width * 0.24);

          // 依序填入 IV 數值
          document.getElementById('ivAtk').value = getPrecisionIV(ctx, barXStart, Math.floor(atkY), barWidth);
          document.getElementById('ivDef').value = getPrecisionIV(ctx, barXStart, Math.floor(defY), barWidth);
          document.getElementById('ivHp').value  = getPrecisionIV(ctx, barXStart, Math.floor(hpY),  barWidth);

          status.innerText = "✅ 依序辨識完成！請確認資料。";
        } catch (e) {
          status.innerText = "⚠️ 辨識過程中發生錯誤，請手動確認數值。";
        }
      };
    }

    // 刻度線錨點高精度 IV 計算函數
    function getPrecisionIV(ctx, startX, y, width) {
      const imgData = ctx.getImageData(startX, y - 3, width, 6).data;
      let filledPixels = 0;

      for (let x = 0; x < width; x++) {
        let isOrange = false;
        for (let dy = 0; dy < 6; dy++) {
          const idx = (dy * width + x) * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];

          // Pokémon GO 橙色與紅黃色條光譜判定
          if (r > 200 && g > 80 && g < 185 && b < 110) {
            isOrange = true;
            break;
          }
        }
        if (isOrange) filledPixels = x + 1;
      }

      // 1. 完全無填滿
      if (filledPixels <= 2) return 0;

      const fillRatio = filledPixels / width;

      // 2. 完全填滿保護 (15)
      if (fillRatio >= 0.96) return 15;

      // 3. 刻度線關鍵點校正 (第一條白線位於 33.3%，第二條白線位於 66.7%)
      const line1 = 0.333; // 代表 5pt
      const line2 = 0.667; // 代表 10pt

      // 若長度接近 10pt 但未突破第 2 條白線，鎖定為 9 (例如膽小蟲攻擊)
      if (fillRatio > 0.60 && fillRatio < line2) {
        return 9;
      }

      // 若長度接近 5pt 但未突破第 1 條白線，鎖定為 4
      if (fillRatio > 0.28 && fillRatio < line1) {
        return 4;
      }

      // 若長度接近 15pt 但未完全滿格，鎖定為 14 (例如拉普拉斯 HP)
      if (fillRatio > 0.90 && fillRatio < 0.96) {
        return 14;
      }

      // 一般情況換算 0~15
      return Math.min(15, Math.max(0, Math.round(fillRatio * 15)));
    }

    function calculate() {
      const name = document.getElementById('pokeName').value || "未命名寶可夢";
      const w = parseFloat(document.getElementById('weight').value) || 0;
      const h = parseFloat(document.getElementById('height').value) || 0;
      const atk = parseInt(document.getElementById('ivAtk').value) || 0;
      const def = parseInt(document.getElementById('ivDef').value) || 0;
      const hp = parseInt(document.getElementById('ivHp').value) || 0;

      const totalIv = atk + def + hp;
      const ivPercent = ((totalIv / 45) * 100).toFixed(1);

      const card = document.getElementById('resultCard');
      const badge = document.getElementById('ivPercentBadge');
      const body = document.getElementById('resultBody');

      badge.innerText = `IV: ${ivPercent}% (${totalIv}/45)`;

      body.innerHTML = `
        <div class="text-base font-bold text-white mb-1">1. 名稱：<span class="text-amber-300">${name}</span></div>
        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 font-mono">
          <div>2. 體重：<span class="font-bold text-white">${w} kg</span></div>
          <div>3. 身高：<span class="font-bold text-white">${h} m</span></div>
          <div>4. 攻擊：<span class="font-bold text-rose-400">${atk}</span> / 15</div>
          <div>5. 防禦：<span class="font-bold text-sky-400">${def}</span> / 15</div>
          <div class="col-span-2">6. HP：<span class="font-bold text-emerald-400">${hp}</span> / 15</div>
        </div>
      `;

      card.classList.remove('hidden');
    }
  </script>
</body>
</html>
